name: Build patched OxAI JAR

on:
  push:
    branches:
      - fix/chat-splitting-mc-1.21.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build Fabric mod
        run: ./gradlew :fabric:build --stacktrace
      - name: Upload installable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oxai-fabric-1.21.10-patched
          path: fabric/build/libs/*.jar
          if-no-files-found: error

# Re-trigger build after enabling GitHub Actions on fork.
